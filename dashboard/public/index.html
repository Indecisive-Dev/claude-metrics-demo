<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Metrics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #888;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.paused {
      background: #f59e0b;
    }

    .pause-btn {
      padding: 8px 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1a1a1a;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .pause-btn:hover {
      background: #252525;
      border-color: #555;
    }

    .pause-btn.paused {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #000;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    .chart-container {
      position: relative;
      height: 200px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }

    .error {
      color: #ef4444;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .stats-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Claude Metrics Dashboard</h1>
    <div class="controls">
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Refreshing every 15s</span>
      </div>
      <button class="pause-btn" id="pauseBtn" onclick="togglePause()">Pause</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Prompts Today</div>
      <div class="stat-value" id="totalToday">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Tokens/Prompt</div>
      <div class="stat-value" id="avgTokens">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Unique Sessions Today</div>
      <div class="stat-value" id="uniqueSessions">-</div>
    </div>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Prompts Per Day</span>
      </div>
      <div class="chart-container">
        <canvas id="promptsPerDayChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Prompts Per Hour (Last 7 Days)</span>
      </div>
      <div class="chart-container">
        <canvas id="promptsPerHourChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Average Words Per Prompt</span>
      </div>
      <div class="chart-container">
        <canvas id="avgWordsChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Average Tokens Per Prompt</span>
      </div>
      <div class="chart-container">
        <canvas id="avgTokensChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let isPaused = false;
    let refreshInterval = null;
    const REFRESH_RATE = 15000;

    // Chart instances
    let charts = {};

    // Chart.js default config
    Chart.defaults.color = '#888';
    Chart.defaults.borderColor = '#333';

    const chartOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
      },
      scales: {
        x: {
          grid: { color: '#222' },
          ticks: { maxTicksLimit: 8 },
        },
        y: {
          grid: { color: '#222' },
          beginAtZero: true,
        },
      },
    };

    function createChart(id, label, color) {
      const ctx = document.getElementById(id).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: label,
            data: [],
            borderColor: color,
            backgroundColor: color + '20',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
          }],
        },
        options: chartOptions,
      });
    }

    function initCharts() {
      charts.promptsPerDay = createChart('promptsPerDayChart', 'Prompts', '#3b82f6');
      charts.promptsPerHour = createChart('promptsPerHourChart', 'Prompts', '#8b5cf6');
      charts.avgWords = createChart('avgWordsChart', 'Avg Words', '#22c55e');
      charts.avgTokens = createChart('avgTokensChart', 'Avg Tokens', '#f59e0b');
    }

    function updateChart(chart, labels, data) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.update('none');
    }

    async function fetchData(endpoint) {
      try {
        const response = await fetch(`/api/${endpoint}`);
        if (!response.ok) throw new Error('Failed to fetch');
        return await response.json();
      } catch (error) {
        console.error(`Error fetching ${endpoint}:`, error);
        return null;
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatHour(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric' });
    }

    async function refreshDashboard() {
      // Fetch all data in parallel
      const [perDay, perHour, avgWords, avgTokens] = await Promise.all([
        fetchData('prompts_per_day'),
        fetchData('prompts_per_hour'),
        fetchData('avg_words_per_prompt'),
        fetchData('avg_tokens_per_prompt'),
      ]);

      // Update prompts per day
      if (perDay?.data) {
        const sorted = [...perDay.data].reverse();
        updateChart(
          charts.promptsPerDay,
          sorted.map(d => formatDate(d.date)),
          sorted.map(d => d.prompt_count)
        );

        // Update today's stats
        if (perDay.data.length > 0) {
          const today = perDay.data[0];
          document.getElementById('totalToday').textContent = today.prompt_count.toLocaleString();
          document.getElementById('uniqueSessions').textContent = today.unique_sessions.toLocaleString();
        }
      }

      // Update prompts per hour
      if (perHour?.data) {
        const sorted = [...perHour.data].reverse().slice(-48); // Last 48 hours
        updateChart(
          charts.promptsPerHour,
          sorted.map(d => formatHour(d.hour)),
          sorted.map(d => d.prompt_count)
        );
      }

      // Update avg words
      if (avgWords?.data) {
        const sorted = [...avgWords.data].reverse();
        updateChart(
          charts.avgWords,
          sorted.map(d => formatDate(d.date)),
          sorted.map(d => d.avg_words)
        );
      }

      // Update avg tokens
      if (avgTokens?.data) {
        const sorted = [...avgTokens.data].reverse();
        updateChart(
          charts.avgTokens,
          sorted.map(d => formatDate(d.date)),
          sorted.map(d => d.avg_tokens)
        );

        // Update avg tokens stat
        if (avgTokens.data.length > 0) {
          document.getElementById('avgTokens').textContent = Math.round(avgTokens.data[0].avg_tokens).toLocaleString();
        }
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('pauseBtn');
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');

      if (isPaused) {
        btn.textContent = 'Resume';
        btn.classList.add('paused');
        dot.classList.add('paused');
        text.textContent = 'Paused';
        clearInterval(refreshInterval);
      } else {
        btn.textContent = 'Pause';
        btn.classList.remove('paused');
        dot.classList.remove('paused');
        text.textContent = 'Refreshing every 15s';
        refreshDashboard();
        refreshInterval = setInterval(refreshDashboard, REFRESH_RATE);
      }
    }

    // Initialize
    initCharts();
    refreshDashboard();
    refreshInterval = setInterval(refreshDashboard, REFRESH_RATE);
  </script>
</body>
</html>
